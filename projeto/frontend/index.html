<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Times</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <header>
        <h1> Campeonato Manager</h1>
        <p>Gerencie os times do campeonato</p>
    </header>

    <section class="form-card">
        <h2 id="form-title">Cadastrar Time</h2>

        <input type="hidden" id="timeId" />
        <input type="text" id="nome" placeholder="Nome do time" />
        <input type="text" id="cidade" placeholder="Cidade" />
        <input type="text" id="estadio" placeholder="Estádio" />

        <button onclick="salvarTime()">Salvar</button>
    </section>

    <section>
        <h2> Times cadastrados</h2>
        <div id="times" class="cards"></div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
